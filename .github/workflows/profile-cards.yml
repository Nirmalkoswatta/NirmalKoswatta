name: Profile cards

on:
  schedule:
    - cron: "0 0 * * *"   # daily 00:00 UTC (05:30 SLST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

concurrency:
  group: profile-cards
  cancel-in-progress: false

permissions:
  contents: write

env:
  USER: NirmalKoswatta
  STATS_COMMON: show_icons=true&include_all_commits=true&hide_border=true
  LANGS_COMMON: layout=compact&langs_count=8&hide_border=true&hide=html,css,scss

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: add a fine-grained PAT as secret PROFILE_STATS_PAT to include private-repo stats.
      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ env.USER }}&${{ env.STATS_COMMON }}&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.PROFILE_STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ env.USER }}&${{ env.STATS_COMMON }}&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.PROFILE_STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ env.USER }}&${{ env.LANGS_COMMON }}&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PROFILE_STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ env.USER }}&${{ env.LANGS_COMMON }}&theme=default
          path: profile/top-langs-light.svg
          token: ${{ secrets.PROFILE_STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: update profile cards"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
